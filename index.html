<style>

  #shootHud .sh-reload { position: absolute; bottom: 20%; right: 4%; color: #FF8A2B; font-size: .7em; }
  #shootHud .sh-over { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 1em 2em; text-align: center;

  /* ===== Телескоп: круглая маска окуляра ===== */
  #scopeView { position: absolute; inset: 0; pointer-events: none; z-index: 4;
               background: radial-gradient(circle closest-side at 50% 50%, transparent 0 93%, rgba(30,40,80,.6) 95%, #000 97%); }

  @keyframes track { from { top: -15%; } to { top: 110%; } }
  .osd { font-size: clamp(16px, 3vw, 34px); text-shadow: 2px 0 #FF2E9A, -2px 0 #2EE6FF; }
  .osd .tl { position: absolute; top: 4%; left: 4%; }
  .osd .tr { position: absolute; top: 4%; right: 4%; }
  .osd .br { position: absolute; bottom: 4%; right: 4%; }
  .osd .bl { position: absolute; bottom: 4%; left: 4%; font-size: .7em; opacity: .8; }
  .rec { color: #E3262B; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>

if (location.protocol === 'file:') {
  const warn = document.createElement('div');
  warn.textContent = 'ЛИЦА НЕ ЗАГРУЗЯТСЯ: открой через VS Code → правый клик по index.html → Open with Live Server';
  warn.style.cssText = 'position:absolute;top:12%;left:50%;transform:translateX(-50%);z-index:5;padding:6px 12px;' +
    'background:#E3262B;color:#fff;font-size:clamp(14px,2vw,22px);text-align:center;';
  document.getElementById('wrap').appendChild(warn);
}

const PIXELS = 640;   // ширина картинки в пикселях: меньше = больше «PS1-мыла»

// ---------------------------------------------------------------------
//  Сцена, камера, рендер
// ---------------------------------------------------------------------
const wrap = document.getElementById('wrap');
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.BasicShadowMap;   // пиксельные тени от солнца на террасе
renderer.setSize(PIXELS, PIXELS * 9 / 16, false);
wrap.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#1A1424');
scene.fog = new THREE.Fog('#1A1424', 14, 30);
const camera = new THREE.PerspectiveCamera(55, 16 / 9, 0.1, 1200);   // далеко — чтобы с террасы была видна пустыня

// Комната: X от -12 до 12, Z от -8 (дальняя стена, бар) до 8, высота 5
const ROOM = { x: 12, z: 8, h: 5 };
const obstacles = [];   // прямоугольники, через которые нельзя пройти (f — этаж)
// Этажи: 0 — подвал, 1 — второй этаж с террасой (стоит прямо на потолке подвала)
const Y2 = 5.3;
const floorY = f => f ? Y2 : 0;
// Лестница между этажами: колонна x1…x2, ступени от zLow (внизу) до zTop (наверху)
const STAIR = { x1: 3.0, x2: 5.4, zLow: -1, zTop: -6 };
const inStairs = (x, z) => x > STAIR.x1 && x < STAIR.x2 && z < STAIR.zLow && z > STAIR.zTop;
// На какой высоте стоит перс: на лестнице — по ступенькам, иначе пол своего этажа
const standY = (f, x, z) => inStairs(x, z) ? Y2 * (STAIR.zLow - z) / (STAIR.zLow - STAIR.zTop) : floorY(f);
let BUILD_FLOOR = 0;                     // какой этаж сейчас строим: свет и препятствия запоминают этаж
const lightsByFloor = [[], []];          // свет одного этажа выключается, пока мы на другом
const hookahs = [];                      // кальяны: { x, z, f, top, coal }
// Наши арты (assets/posters/<file>.jpg): на стене — в VHS-стиле, по F — в полном качестве
const ARTS = [
  { file: 'fallen-city',  title: 'FALLEN CITY',      w: 1368, h: 2000 },
  { file: 'angels-world', title: 'ANGELS WORLD',     w: 1368, h: 2000 },
  { file: 'darkness',     title: 'DARKNESS',         w: 1368, h: 2000 },
  { file: 'light-dark',   title: 'LIGHT / DARK',     w: 1368, h: 2000 },
  { file: 'cold-winter',  title: 'COLD WINTER',      w: 1368, h: 2000 },
  { file: 'ivanovo',      title: 'ИВАНОВО',          w: 1080, h: 1440 },
  { file: 'greed',        title: 'GREED',            w: 1080, h: 1433 },
  { file: 'samurai',      title: 'ДЕНЬ, КОГДА ВСЁ РЕШИЛОСЬ', w: 1224, h: 1536 },
  { file: 'vampire',      title: 'VAMPIRE',          w: 1224, h: 1644 },
  { file: 'trash',        title: 'YOU ARE TRASH',    w: 1156, h: 2000 },
  { file: '4-kolesa',     title: '4 КОЛЕСА',         w: 1080, h: 1350 },
];
const artSpots = [];                     // где висят: { i, x, z, f, nx, nz }
// Терраса: стойка с винтовкой, телескоп и шезлонги (на них можно лечь)
const RIFLE_SPOT = { x: -3.2, z: 11.7 }, SCOPE_SPOT = { x: 0, z: 11.4 };
const LOUNGERS = [{ x: -8.6, z: 9.2 }, { x: -6.4, z: 9.2 }];
let parasol = null;                      // зонт над шезлонгами (складывается, когда лёг смотреть на звёзды)
// NGA-винтовка: чёрная снайперка с оптикой, розовая неоновая полоса и лого на прикладе. Ствол смотрит в −z
function makeRifle() {
  const g = new THREE.Group(), body = mat('#1b1820'), metal = mat('#3a3640'), pink = glow('#FF2E9A');
  const part = (geo, m, x, y, z, rx = 0) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.rotation.x = rx; g.add(o); return o; };
  part(new THREE.BoxGeometry(0.08, 0.15, 0.42), body, 0, -0.02, 0.38);                        // приклад
  part(new THREE.BoxGeometry(0.09, 0.11, 0.42), metal, 0, 0, 0);                               // ствольная коробка
  part(new THREE.CylinderGeometry(0.02, 0.024, 0.95, 8), metal, 0, 0.01, -0.66, Math.PI / 2);  // ствол
  part(new THREE.CylinderGeometry(0.035, 0.035, 0.09, 8), body, 0, 0.01, -1.15, Math.PI / 2);  // дульный тормоз
  part(new THREE.CylinderGeometry(0.034, 0.034, 0.4, 10), body, 0, 0.11, -0.03, Math.PI / 2);  // прицел
  for (const z of [-0.24, 0.18]) part(new THREE.CylinderGeometry(0.046, 0.04, 0.06, 10), body, 0, 0.11, z, Math.PI / 2);
  part(new THREE.CylinderGeometry(0.03, 0.03, 0.01, 10), glow('#2EE6FF'), 0, 0.11, -0.275, Math.PI / 2);   // линза
  part(new THREE.BoxGeometry(0.05, 0.14, 0.06), body, 0, -0.11, 0.13).rotation.x = -0.3;      // рукоять
  part(new THREE.BoxGeometry(0.05, 0.13, 0.08), metal, 0, -0.1, -0.08);                       // магазин
  for (const s of [-1, 1]) part(new THREE.BoxGeometry(0.004, 0.012, 0.6), pink, s * 0.046, 0.0, -0.05);   // неон по бокам
  const tc = document.createElement('canvas'); tc.width = 64; tc.height = 24;
  const tg = tc.getContext('2d'); tg.fillStyle = '#1b1820'; tg.fillRect(0, 0, 64, 24);
  tg.font = 'bold 20px Impact, sans-serif'; tg.textAlign = 'center'; tg.fillStyle = '#FF2E9A'; tg.fillText('NGA', 32, 20);
  const decal = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(tc) });
  for (const s of [-1, 1]) { const d = part(new THREE.PlaneGeometry(0.3, 0.11), decal, s * 0.041, -0.02, 0.38); d.rotation.y = s * Math.PI / 2; }
  return g;
}
let ambient, hemi;                       // общий свет — днём/ночью на террасе меняется

// Пиксельная «грязная» текстура из шума
function noiseTex(base, spread = 18, size = 32, stains = 0) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); const col = new THREE.Color(base);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const n = (Math.random() - 0.5) * spread / 255;
    g.fillStyle = `rgb(${(col.r + n) * 255},${(col.g + n) * 255},${(col.b + n) * 255})`;
    g.fillRect(x, y, 1, 1);
  }
  g.fillStyle = 'rgba(26,20,36,.35)';
  for (let i = 0; i < stains; i++) {
    g.beginPath(); g.arc(Math.random() * size, Math.random() * size, 1 + Math.random() * 4, 0, 7); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;

// Арт на стене в стиле нашей кассеты: мало пикселей, сдвиг цветов, строки развёртки, шум, виньетка
function vhsArtTex(file, aspect) {
  const W = 160, H = Math.round(W / aspect);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); g.fillStyle = '#111'; g.fillRect(0, 0, W, H);
  const t = new THREE.CanvasTexture(c); t.magFilter = THREE.NearestFilter; t.colorSpace = THREE.SRGBColorSpace;
  const img = new Image();
  img.onload = () => {
    const sw = 80, sh = Math.round(sw / aspect);                  // «кассетное» разрешение
    const small = document.createElement('canvas'); small.width = sw; small.height = sh;
    const sg = small.getContext('2d'); sg.filter = 'contrast(1.15) saturate(0.85) sepia(0.12)'; sg.drawImage(img, 0, 0, sw, sh);
    const tint = col => {                                         // копия только в одном цвете — для сдвига каналов
      const k = document.createElement('canvas'); k.width = sw; k.height = sh;
      const kg = k.getContext('2d'); kg.drawImage(small, 0, 0); kg.globalCompositeOperation = 'multiply';
      kg.fillStyle = col; kg.fillRect(0, 0, sw, sh); return k;
    };
    g.imageSmoothingEnabled = false;
    g.drawImage(small, 0, 0, W, H);
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = 0.22; g.drawImage(tint('#ff0040'), 2, 0, W, H);
    g.globalAlpha = 0.18; g.drawImage(tint('#00e5ff'), -2, 0, W, H);
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
    g.fillStyle = 'rgba(0,0,0,.28)'; for (let y = 0; y < H; y += 2) g.fillRect(0, y, W, 1);          // строки развёртки
    for (let i = 0; i < W * H * 0.015; i++) {                                                      // шум
      g.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,.18)' : 'rgba(0,0,0,.25)';
      g.fillRect(Math.random() * W | 0, Math.random() * H | 0, 1, 1);
    }
    const by = H * (0.2 + Math.random() * 0.6) | 0;                                                 // полоса трекинга
    g.drawImage(c, 0, by, W, 4, 3, by, W, 4); g.fillStyle = 'rgba(255,255,255,.1)'; g.fillRect(0, by, W, 4);
    const v = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
    t.needsUpdate = true;
  };
  img.src = `assets/posters/${file}.jpg`;
  return t;
}

function hookah(x, z, y0, color, end, s = 1) {

  const add = (geo, m, px, py, pz) => { const o = new THREE.Mesh(geo, m); o.position.set(px, py, pz); g.add(o); return o; };
  const prof = [[0, 0], [0.2, 0.02], [0.29, 0.12], [0.3, 0.24], [0.22, 0.36], [0.09, 0.44], [0.06, 0.5]]
    .map(([a, b]) => new THREE.Vector2(a, b));
  add(new THREE.LatheGeometry(prof, 8), new THREE.MeshLambertMaterial({ color, emissive: color, emissiveIntensity: 0.35,
    transparent: true, opacity: 0.85, flatShading: true }), 0, 0, 0);                        // колба
  add(new THREE.CylinderGeometry(0.035, 0.045, 0.6, 6), M.chrome, 0, 0.78, 0);              // шахта
  for (const y of [0.6, 0.82]) add(new THREE.CylinderGeometry(0.075, 0.075, 0.04, 8), mat('#c9a227'), 0, y, 0);
  add(new THREE.CylinderGeometry(0.2, 0.2, 0.025, 10), M.chrome, 0, 0.98, 0);               // блюдце
  add(new THREE.CylinderGeometry(0.1, 0.06, 0.14, 8), mat('#8a3b22'), 0, 1.07, 0);          // чаша
  const coal = new THREE.MeshBasicMaterial({ color: '#ff5a1f' });
  for (const [cx, cz] of [[-0.03, 0.02], [0.03, -0.02], [0, 0.035]])
    add(new THREE.BoxGeometry(0.05, 0.035, 0.05), coal, cx, 1.155, cz);                     // угли
  // шланг: от штуцера вниз, провисает до пола и поднимается к мундштуку
  const e = new THREE.Vector3(...end).sub(g.position).divideScalar(s);
  const dir = new THREE.Vector3(e.x, 0, e.z).normalize(), fl = -y0 / s + 0.04;
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(dir.x * 0.06, 0.62, dir.z * 0.06),
    new THREE.Vector3(dir.x * 0.25, 0.45, dir.z * 0.25),
    new THREE.Vector3(e.x * 0.5, fl, e.z * 0.5),
    new THREE.Vector3(e.x * 0.85, (fl + e.y) / 2, e.z * 0.85),
    e,
  ]);
  g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 24, 0.022, 5), mat('#2b2233')));
  add(new THREE.CylinderGeometry(0.03, 0.02, 0.14, 6), M.chrome, e.x, e.y + 0.05, e.z);    // мундштук
  if (y0 === 0) obstacles.push({ x1: x - 0.32 * s, x2: x + 0.32 * s, z1: z - 0.32 * s, z2: z + 0.32 * s, f: BUILD_FLOOR });
  hookahs.push({ x, z, f: BUILD_FLOOR, top: new THREE.Vector3(x, y0 + 1.2 * s, z), coal });
}

// ---------------------------------------------------------------------
//  МИНИИГРА «ТАРКОВ: ПОДВАЛ» — вид сверху. Собери лут, не сдохни,
//  дойди до экстракта. Дикие (скавы) ходят и стреляют.
// ---------------------------------------------------------------------
const RAID_WALLS = [[70, 40, 12, 90], [150, 120, 90, 12], [230, 30, 12, 70], [110, 180, 12, 50], [260, 160, 50, 12]];
const LOOT_TYPES = [
  { name: 'ВИДЕОКАРТА', value: 120, color: '#7CFF5B' }, { name: 'ТУШЁНКА', value: 15, color: '#C9D3E0' },
  { name: 'ШАУРМА', value: 25, color: '#e6cf9a' },     { name: 'ЭНЕРГОС', value: 20, color: '#2EE6FF' },
  { name: 'ПАТРОНЫ', value: 30, color: '#FF8A2B' },     { name: 'ЖЁСТКИЙ ДИСК', value: 80, color: '#FF2E9A' },
];
const raid = {};
const hitsWall = (x, y, r) => x < r || y < r || x > PIG.w - r || y > PIG.h - 20 - r ||
  RAID_WALLS.some(([wx, wy, ww, wh]) => x + r > wx && x - r < wx + ww && y + r > wy && y - r < wy + wh);
function freeSpot(minDist = 0) {
  for (;;) {
    const x = 15 + Math.random() * (PIG.w - 30), y = 15 + Math.random() * (PIG.h - 50);
    if (!hitsWall(x, y, 8) && Math.hypot(x - 24, y - 190) > minDist) return { x, y };
  }
}
function raidNew() {
  Object.assign(raid, { state: 'brief', time: 90, hp: 3, cash: 0, cool: 0, msg: '', msgT: 0,
    p: { x: 24, y: 190 }, bullets: [], loot: [], scavs: [], ex: { x: 270, y: 8, w: 44, h: 28 } });
  for (let i = 0; i < 6; i++) raid.loot.push({ ...freeSpot(40), ...LOOT_TYPES[Math.floor(Math.random() * LOOT_TYPES.length)] });
  for (let i = 0; i < 3; i++) raid.scavs.push({ ...freeSpot(110), hp: 2, cool: 1 + Math.random(), dir: Math.random() * 7 });
}
function raidShoot() {
  if (raid.state !== 'run') { if (raid.state === 'brief' || raid.state === 'end') { raidNew(); raid.state = 'run'; } return; }
  if (raid.cool > 0) return;
  const a = Math.atan2(os.mouse.y - raid.p.y, os.mouse.x - raid.p.x);
  raid.bullets.push({ x: raid.p.x, y: raid.p.y, vx: Math.cos(a) * 280, vy: Math.sin(a) * 280, mine: true });
  raid.cool = 0.25;
}
function raidEnd(text) { raid.state = 'end'; raid.msg = text; }
function raidUpdate(dt) {
  if (raid.state !== 'run') return;
  const P = raid.p;
  raid.time -= dt; raid.cool -= dt;
  if (raid.time <= 0) return raidEnd('ПРОПАЛ БЕЗ ВЕСТИ');
  // ходьба игрока (WASD), стены не пускают
  let mx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  let my = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  const l = Math.hypot(mx, my) || 1, sp = 70 * dt;
  if (!hitsWall(P.x + mx / l * sp, P.y, 5)) P.x += mx / l * sp;
  if (!hitsWall(P.x, P.y + my / l * sp, 5)) P.y += my / l * sp;
  // подбираем лут
  raid.loot = raid.loot.filter(it => {
    if (Math.hypot(it.x - P.x, it.y - P.y) > 9) return true;
    raid.cash += it.value; raid.msg = '+ ' + it.name; raid.msgT = 1.5; return false;
  });
  if (raid.msgT > 0) raid.msgT -= dt;
  // экстракт
  const ex = raid.ex;
  if (P.x > ex.x && P.x < ex.x + ex.w && P.y > ex.y && P.y < ex.y + ex.h) return raidEnd('ЭВАКУАЦИЯ ✔');
  // дикие: бродят, а если видят рядом — идут к тебе и стреляют
  for (const s of raid.scavs) {
    const d = Math.hypot(P.x - s.x, P.y - s.y), close = d < 120;
    if (close) s.dir = Math.atan2(P.y - s.y, P.x - s.x); else if (Math.random() < dt) s.dir += (Math.random() - 0.5) * 3;
    const v = (close && d < 50 ? 0 : 28) * dt;
    const nx = s.x + Math.cos(s.dir) * v, ny = s.y + Math.sin(s.dir) * v;
    if (!hitsWall(nx, ny, 5)) { s.x = nx; s.y = ny; } else s.dir += Math.PI / 2;
    s.cool -= dt;
    if (close && s.cool <= 0) {
      const a = s.dir + (Math.random() - 0.5) * 0.4;             // косой дикий
      raid.bullets.push({ x: s.x, y: s.y, vx: Math.cos(a) * 140, vy: Math.sin(a) * 140, mine: false });
      s.cool = 1.2 + Math.random();
    }
  }
  // пули
  for (const b of raid.bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (hitsWall(b.x, b.y, 1)) b.dead = true;
    if (b.mine) {
      for (const s of raid.scavs) if (Math.hypot(b.x - s.x, b.y - s.y) < 6) { s.hp--; b.dead = true; }
    } else if (Math.hypot(b.x - P.x, b.y - P.y) < 6) { raid.hp--; b.dead = true; }
  }
  raid.bullets = raid.bullets.filter(b => !b.dead);
  raid.scavs = raid.scavs.filter(s => s.hp > 0);
  if (raid.hp <= 0) { raid.cash = 0; raidEnd('ПОГИБ В РЕЙДЕ'); }
}
function raidDraw(g) {
  g.fillStyle = '#2a2a22'; g.fillRect(0, 0, PIG.w, PIG.h);       // бетон
  g.fillStyle = '#56584a'; for (const [x, y, w, h] of RAID_WALLS) g.fillRect(x, y, w, h);
  const ex = raid.ex;                                              // зона эвакуации
  g.fillStyle = 'rgba(124,255,91,.25)'; g.fillRect(ex.x, ex.y, ex.w, ex.h);

  for (const it of raid.loot) { g.fillStyle = it.color; g.fillRect(it.x - 3, it.y - 3, 7, 7); }
  for (const s of raid.scavs) { g.fillStyle = '#c94c3a'; g.fillRect(s.x - 5, s.y - 5, 10, 10); g.fillStyle = '#1A1424'; g.fillRect(s.x - 2 + Math.cos(s.dir) * 3, s.y - 2 + Math.sin(s.dir) * 3, 4, 4); }
  for (const b of raid.bullets) { g.fillStyle = b.mine ? '#fff7b0' : '#ff8a80'; g.fillRect(b.x - 1, b.y - 1, 3, 3); }

  // HUD

  g.fillStyle = '#7CFF5B'; g.fillText(`ЛУТ ${raid.cash}K ₽`, 80, PIG.h - 6);

  g.textAlign = 'center';
  if (raid.msgT > 0 && raid.state === 'run') { g.fillStyle = '#7CFF5B'; g.fillText(raid.msg, PIG.w / 2, 16); }
  if (raid.state !== 'run') {
    g.fillStyle = 'rgba(10,10,8,.8)'; g.fillRect(30, 60, 260, 100);
    g.fillStyle = raid.state === 'end' && raid.msg.startsWith('ЭВАК') ? '#7CFF5B' : '#C9D3E0';
    g.font = '30px VT323, monospace';
    g.fillText(raid.state === 'brief' ? 'РЕЙД: ПОДВАЛ' : raid.msg, PIG.w / 2, 95);
    g.font = '16px VT323, monospace'; g.fillStyle = '#C9D3E0';
    g.fillText(raid.state === 'brief' ? 'СОБЕРИ ЛУТ И ДОЙДИ ДО ЭКСТРАКТА' : `ВЫНЕС: ${raid.cash}K ₽`, PIG.w / 2, 120);
    g.fillText('ЛКМ — ' + (raid.state === 'brief' ? 'В РЕЙД' : 'ЕЩЁ РЕЙД'), PIG.w / 2, 142);
  }
}

// ---------------------------------------------------------------------
//  ПЕРСОНАЖ: low-poly моделька из блоков, смотрит вперёд по +Z
// ---------------------------------------------------------------------
// Кусочек модели: коробка нужного цвета внутри группы parent
function part(parent, w, h, d, color, x, y, z, glowing = false) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), glowing ? glow(color) : mat(color));
  m.position.set(x, y, z); parent.add(m); return m;
}
// Прядь/шип волос: четырёхгранный конус
function spike(parent, color, x, y, z, rx, rz, len = 0.4, r = 0.14) {
  const m = new THREE.Mesh(new THREE.ConeGeometry(r, len, 4), mat(color));
  m.position.set(x, y, z); m.rotation.set(rx, 0, rz); parent.add(m); return m;
}
// Предмет в руке (крепится к кисти)
function prop(hand, type) {
  const g = new THREE.Group(); g.position.set(0, -0.05, 0.16); hand.add(g);
  if (type === 'can') {                                             // энергетик Дани
    cylIn(g, 0.1, 0.32, '#141414'); cylIn(g, 0.102, 0.12, '#7CFF5B', true);
  } else if (type === 'shawarma') {                                 // шаурма Ярика
    cylIn(g, 0.11, 0.36, '#e6cf9a').rotation.z = 0.3;
    part(g, 0.16, 0.06, 0.16, '#a0522d', 0.05, 0.2, 0); part(g, 0.08, 0.05, 0.08, '#4caf50', 0.02, 0.24, 0.03);
  } else if (type === 'vape') {                                     // электронка Эдика
    part(g, 0.08, 0.24, 0.05, '#141414', 0, 0.05, 0); part(g, 0.04, 0.04, 0.052, '#FF2E9A', 0, 0.16, 0, true);
  } else if (type === 'cola') {                                     // кола Эдика
    cylIn(g, 0.075, 0.26, '#5a0d10'); cylIn(g, 0.035, 0.12, '#5a0d10').position.y = 0.19;
    cylIn(g, 0.04, 0.03, '#E3262B').position.y = 0.26;
  }
}
function cylIn(parent, r, h, color, glowing = false) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 8), glowing ? glow(color) : mat(color));
  parent.add(m); return m;
}
// Наушники: на голове (Ярик) или на шее (Эдик)
function headphones(parent, c, y, onHead) {
  const g = new THREE.Group(); g.position.y = y; parent.add(g);
  const sx = onHead ? 0.5 : 0.3, z = onHead ? 0 : 0.18;
  for (const s of [-1, 1]) {
    part(g, 0.18, 0.38, 0.34, '#18161e', s * sx, 0, z);
    part(g, 0.02, 0.26, 0.06, c.color, s * (sx + 0.1), 0, z + 0.05, true);   // светящаяся полоска
  }
  if (onHead) part(g, 1.05, 0.1, 0.16, '#18161e', 0, 0.5, 0);               // дужка
  else part(g, 0.66, 0.08, 0.1, '#18161e', 0, 0.12, -0.05);
}

let makeCharacter = function (c) {
  const root = new THREE.Group();
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.55, 12),
    new THREE.MeshBasicMaterial({ color: '#000', transparent: true, opacity: 0.45 }));

  const rig = new THREE.Group(); rig.scale.setScalar(c.size * 0.85);   // то, что прыгает и поворачивается
  root.add(shadow, rig);
  const W = c.wide;

  // Ноги (поворачиваются от бедра) с ботинками-утюгами
  const legs = [-1, 1].map(s => {
    const leg = new THREE.Group(); leg.position.set(s * 0.19 * W, 0.95, 0); rig.add(leg);
    part(leg, 0.34, 0.75, 0.36, c.pants, 0, -0.4, 0);                            // мешковатые штаны

    part(leg, 0.38, 0.06, 0.52, '#0d0c10', 0, -0.94, 0.06);                      // подошва

  });

  // Торс
  const torso = new THREE.Group(); torso.position.y = 0.95; rig.add(torso);
  part(torso, 0.78 * W, 0.72, 0.44, c.shirt, 0, 0.36, 0);
  if (c.hoodie) {
    part(torso, 0.04, 0.68, 0.02, '#5a5a62', -0.12, 0.36, 0.23);                 // молнии худи
    part(torso, 0.04, 0.68, 0.02, '#5a5a62', 0.12, 0.36, 0.23);
    part(torso, 0.6, 0.3, 0.2, c.shirt, 0, 0.7, -0.24);                          // капюшон на спине
  } else if (c.id === 'yarik') {
    part(torso, 0.3, 0.03, 0.02, '#C9D3E0', 0, 0.62, 0.23);                      // цепочка
  }

  // Руки (качаются от плеча), крупные кисти
  const arms = [-1, 1].map(s => {
    const arm = new THREE.Group(); arm.position.set(s * (0.41 * W + 0.12), 1.6, 0); rig.add(arm);
    part(arm, 0.26, c.hoodie ? 0.6 : 0.3, 0.28, c.shirt, 0, c.hoodie ? -0.27 : -0.12, 0); // рукав
    if (!c.hoodie) part(arm, 0.18, 0.34, 0.2, c.skin, 0, -0.42, 0);                       // предплечье
    const hand = part(arm, 0.24, 0.24, 0.26, c.skin, 0, -0.7, 0.02);                      // кисть
    const item = s > 0 ? c.left : c.right;            // s=+1 — левая рука (персонаж смотрит на нас)
    if (item) prop(hand, item);

  });

  // Голова: большой куб, на лицевой грани — лицо с картинки
  const head = new THREE.Group(); head.position.y = 1.67; rig.add(head);
  const skinMat = mat(c.skin), faceMat = new THREE.MeshLambertMaterial({ color: c.skin });

const puffs = [];
const puffMat = new THREE.MeshLambertMaterial({ color: '#C9D3E0', transparent: true, opacity: 0.5, flatShading: true });
const PUFF_GEO = new THREE.IcosahedronGeometry(1, 0);
// color — цвет дыма (вкус забивки), delay — через сколько секунд клуб появится, jitter — разброс по X
function spawnPuff(x, y, z, size = 0.15, v = { x: 0, y: 0.5, z: 0 }, max = 2.5, grow = 1.5, color = null, delay = 0, jitter = 0.2, lift = 0.25) {
  const mat = puffMat.clone();
  if (color) { mat.color.set(color); mat.emissive.set(color).multiplyScalar(0.45); }
  const m = new THREE.Mesh(PUFF_GEO, mat);
  m.position.set(x + (Math.random() - 0.5) * jitter, y, z); m.scale.setScalar(size); m.visible = delay <= 0; scene.add(m);
  puffs.push({ m, life: -delay, v, max, grow, size, op: color ? 0.6 : 0.5, lift });
}
function updatePuffs(dt) {
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; p.life += dt;
    if (p.life < 0) continue;                                     // ещё не появился
    p.m.visible = true;
    const drag = Math.exp(-dt * 1.2);                             // дым тормозит, но всё равно ползёт вверх
    p.v.x *= drag; p.v.z *= drag; p.v.y = p.v.y * drag + dt * p.lift;
    p.m.position.x += p.v.x * dt; p.m.position.y += p.v.y * dt; p.m.position.z += p.v.z * dt;
    p.m.scale.setScalar(p.size * (1 + p.life * p.grow));
    p.m.material.opacity = p.op * Math.max(0, 1 - p.life / p.max);
    if (p.life > p.max) { scene.remove(p.m); p.m.material.dispose(); puffs.splice(i, 1); }
  }
}
// Огромное облако кальяна: десятки клубов из рта, летят вперёд-вверх и медленно расплываются.
// color — цвет вкуса, k — крепость (больше клубов, крупнее и дальше)
function hugeCloud(head, color = null, k = 1) {

  const f = new THREE.Vector3(0, 0.15, 2); head.localToWorld(f); f.sub(o).normalize();
  for (let i = 0; i < Math.round(55 * k); i++) {
    const sp = (1.5 + Math.random() * 3.5) * (0.7 + 0.3 * k), a = (Math.random() - 0.5) * 1.6;
    const dir = f.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), a);
    spawnPuff(o.x, o.y, o.z, (0.18 + Math.random() * 0.3) * (0.8 + 0.2 * k),
      { x: dir.x * sp, y: 0.3 + Math.random() * 1.4, z: dir.z * sp }, 4 + Math.random() * 3, 2 + Math.random() * 1.5, color);
  }
}
// Логотип NGA (обведён по картинке 850×850: x 80…765, y 332…520) — три фигуры
const LOGO = [
  [[115, 365], [240, 333], [365, 507], [272, 507], [205, 415], [180, 492], [80, 520], [123, 388]],
  [[300, 385], [338, 332], [500, 332], [530, 375], [365, 377], [428, 463], [455, 463], [478, 428], [440, 428], [425, 403], [570, 403], [512, 507], [387, 507]],
  [[537, 352], [550, 332], [620, 332], [765, 520], [648, 507], [627, 478], [555, 478], [570, 462], [603, 447], [580, 415]],
];
let logoPts = null;
function logoPoints() {                                           // точки внутри логотипа: u −0.5…0.5, v 0…1
  if (logoPts) return logoPts;
  const W = 137, H = 38, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); g.fillStyle = '#fff';
  for (const poly of LOGO) {
    g.beginPath(); poly.forEach(([x, y], i) => g[i ? 'lineTo' : 'moveTo']((x - 80) * W / 685, (y - 332) * H / 188)); g.closePath(); g.fill();
  }
  const d = g.getImageData(0, 0, W, H).data; logoPts = [];
  for (let y = 1; y < H; y += 3) for (let x = 1; x < W; x += 3) if (d[(y * W + x) * 4 + 3] > 128) logoPts.push([x / W - 0.5, 1 - y / H]);
  return logoPts;
}
// Дым-логотип: струя изо рта, а впереди из клубов проявляется «NGA» (всегда читается — повёрнут к камере)
function logoCloud(head, color, k = 1) {
  const o = new THREE.Vector3(0, 0.15, 0.8); head.localToWorld(o);
  const f = new THREE.Vector3(0, 0.15, 2); head.localToWorld(f); f.sub(o).setY(0).normalize();
  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion).setY(0).normalize();
  const W = 3.4 * Math.sqrt(k), H = W * 38 / 137, c = o.clone().addScaledVector(f, 2.6 + k * 0.6); c.y += 0.45;
  for (let i = 0; i < 18; i++)                                    // струя к логотипу
    spawnPuff(o.x, o.y, o.z, 0.12, { x: f.x * (2 + Math.random() * 2), y: 0.4 + Math.random() * 0.5, z: f.z * (2 + Math.random() * 2) }, 1.6, 1.6, color, i * 0.02);
  for (const [u, v] of logoPoints()) {
    const p = c.clone().addScaledVector(right, u * W); p.y += v * H;
    spawnPuff(p.x, p.y, p.z, 0.09 * Math.sqrt(k), { x: f.x * 0.12, y: 0.06, z: f.z * 0.12 }, 4 + k * 1.5, 0.22, color, 0.25 + (u + 0.5) * 0.6, 0, 0.03);
  }
}

const toLinear = v => v < 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;

// Столкновения: круг игрока выталкивается из прямоугольников своего этажа
const FLOOR_BOUNDS = [{ x: ROOM.x, z1: -ROOM.z, z2: ROOM.z }, { x: ROOM.x, z1: -ROOM.z, z2: 12.4 }];   // наверху — до перил террасы
function collide(p, r = 0.4) {
  const B = FLOOR_BOUNDS[p.floor || 0];
  p.x = Math.max(-B.x + r, Math.min(B.x - r, p.x));
  p.z = Math.max(B.z1 + r, Math.min(B.z2 - r, p.z));
  for (const o of obstacles) {
    if ((o.f || 0) !== (p.floor || 0)) continue;
    const cx = Math.max(o.x1, Math.min(o.x2, p.x)), cz = Math.max(o.z1, Math.min(o.z2, p.z));
    const dx = p.x - cx, dz = p.z - cz, d = Math.hypot(dx, dz);
    if (d < r) {
      if (d > 0.0001) { p.x = cx + dx / d * r; p.z = cz + dz / d * r; }
      else { p.z = o.z2 + r; }
    }
  }
}

  coin:   () => [988, 1319].forEach((f, i) => tone(f, 0.25, 'square', 0.06, f, i * 0.08)),
  select: () => tone(440, 0.08, 'square', 0.05, 880),
  shot:   () => { noise(0.35, 700, 0.6); tone(110, 0.35, 'sawtooth', 0.18, 35); noise(0.9, 250, 0.12, 0.1); },   // выстрел + эхо
  empty:  () => tone(1600, 0.03, 'square', 0.05),
  reload: () => [0, 0.35, 0.8].forEach((d, i) => { noise(0.05, 2800 - i * 600, 0.25, d); tone(300 + i * 80, 0.05, 'square', 0.05, 200, d); }),
  screech:() => { tone(1500, 0.5, 'sawtooth', 0.06, 450); tone(1900, 0.35, 'square', 0.03, 700, 0.05); },   // крик птеродактиля

};
let stepT = 0, wasAir = false, gulpT = 0;
function soundTick(dt) {
  if (current === null || pcMode || slotMode) return;
  stepT -= dt;
  if (player.moving && player.jumpY === 0 && stepT <= 0) { SFX.step(); stepT = 0.32; }
  const air = player.jumpY > 0;
  if (wasAir && !air) SFX.land();
  wasAir = air;
  if (drinkTime > 0) { gulpT -= dt; if (gulpT <= 0 && drinkTime < DRINK_DURATION - 0.6) { SFX.gulp(); gulpT = 0.45; } }
}

function loop() {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  update(dt, t); updatePuffs(dt); updateRemotes(dt); netTick(t, dt); soundTick(dt);
  updateEnv(); updateDesert(dt, t); updateHookahs(dt, t); updatePteros(dt, t);
  // статус сети прямо в OSD: видно, подключился ли ты и сколько людей на странице
  osdMode.textContent += !db ? ' · ОФЛАЙН' : ` · ОНЛАЙН: ${remotes.size + 1}` + (netErr ? ` · НЕ ОТПРАВЛЯЕТСЯ: ${netErr}` : '');
  renderer.render(scene, camera);
  const s = Math.floor(t), pad = n => String(n).padStart(2, '0');
  timecode.textContent = `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
  requestAnimationFrame(loop);
}
loop();
</script>
